[package]
name = "rsstig"
version = "0.1.0"
edition = "2024"
description = "An unconventional terminal RSS/Atom reader"
license = "Unlicense"
repository = "https://github.com/indium114/rsstig"
homepage = "https://github.com/indium114/rsstig"

[dependencies]
color-eyre = "0.6.5"
dirs = "6.0.0"
feed-rs = "2.4.0"
indicatif = "0.18.6"
limner = "0.5.0"
markdowndown = "0.1.0"
opml = "1.1.6"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
